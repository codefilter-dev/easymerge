name: Bug report
description: Report a reproducible problem with EasyMerge.
title: "Bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, tokens, private source code, or customer data.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Briefly describe the observed behaviour.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: contact
    attributes:
      label: Contact email (optional)
      description: We will only use this to follow up about this report.
